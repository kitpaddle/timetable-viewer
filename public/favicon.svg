<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 30 30">
  <circle cx="16" cy="16" r="15" fill="#1e1e1e" stroke="#888" stroke-width="1"/>
  <!-- Hour ticks at 12, 3, 6, 9 — right against the rim -->
  <line x1="16" y1="2"  x2="16" y2="7"  stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="16" x2="25" y2="16" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="16" y2="25" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
  <line x1="2"  y1="16" x2="7"  y2="16" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour hand at 10 o'clock -->
  <line x1="16" y1="16" x2="8" y2="11.5" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand at 12 in cyan -->
  <line x1="16" y1="16" x2="16" y2="4"   stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.5" fill="#22d3ee"/>
</svg>
